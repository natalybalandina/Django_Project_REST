version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: lms_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      # Django
      SECRET_KEY: django-insecure-test-key-123
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1

      # Database
      POSTGRES_DB: lms_db
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # Email
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: noreply@lms.com

      # Stripe
      STRIPE_SECRET_KEY: sk_test_dummy_key_12345
      STRIPE_PUBLISHABLE_KEY: pk_test_dummy_key_12345

      # Cache
      CACHE_ENABLED: "True"

      # Celery
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command: >
      sh -c "
      echo 'Waiting for database...' &&
      sleep 5 &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      echo 'Creating superuser...' &&
      python manage.py create_superuser || echo 'Superuser already exists' &&
      echo 'Creating moderator groups...' &&
      python manage.py create_groups || echo 'Groups already exist' &&
      echo 'Starting server...' &&
      python manage.py runserver 0.0.0.0:8000
      "

volumes:
  postgres_data: