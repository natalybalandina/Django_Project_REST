version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: lms_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lms_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: lms_backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Django
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-123}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}

      # Database
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}

      # Email
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST:-}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      EMAIL_USE_SSL: ${EMAIL_USE_SSL:-False}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER:-}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD:-}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL:-noreply@lms.local}

      # Stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_dummy}

      # Cache
      CACHE_ENABLED: ${CACHE_ENABLED:-True}

      # Celery
      CELERY_BROKER_URL: redis://redis:${REDIS_PORT:-6379}/0
      CELERY_RESULT_BACKEND: redis://redis:${REDIS_PORT:-6379}/1
    volumes:
      - static_volume:/app/static
      - media_volume:/app/media
      - ./:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "
      echo 'Waiting for database...' &&
      sleep 5 &&  # Даем время базе данных запуститься
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      python manage.py create_superuser || echo 'Superuser already exists' &&
      python manage.py create_groups || echo 'Groups already exist' &&
      echo 'Starting server...' &&
      python manage.py runserver 0.0.0.0:8000
      "

  celery_worker:
    build: .
    container_name: lms_celery_worker
    depends_on:
      - redis
      - backend
    volumes:
      - ./:/app
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-123}
      DEBUG: ${DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      CELERY_BROKER_URL: redis://redis:${REDIS_PORT:-6379}/0
      CELERY_RESULT_BACKEND: redis://redis:${REDIS_PORT:-6379}/1
    command: celery -A config worker --loglevel=info

  celery_beat:
    build: .
    container_name: lms_celery_beat
    depends_on:
      - redis
      - backend
      - celery_worker
    volumes:
      - ./:/app
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-dev-key-123}
      DEBUG: ${DEBUG:-True}
      POSTGRES_DB: ${POSTGRES_DB:-lms_db}
      POSTGRES_USER: ${POSTGRES_USER:-lms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lms_password}
      POSTGRES_HOST: db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      CELERY_BROKER_URL: redis://redis:${REDIS_PORT:-6379}/0
      CELERY_RESULT_BACKEND: redis://redis:${REDIS_PORT:-6379}/1
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler

volumes:
  postgres_data:
  static_volume:
  media_volume: